theme = "base16_default"
# theme = "base16_transparent"
# theme = "ayu_mirage"
# theme = "base16_terminal"

[editor]
true-color = true
line-number = "relative"
cursorline = true

[editor.lsp]
display-progress-messages = true

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "block"

[editor.indent-guides]
render = true
